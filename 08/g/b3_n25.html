<div id='content'>
<!-- gigi_r080717_1.pdf:5 ke.txt:6990 --><div class='rbox'><pre>問２ 令和８年度診療報酬改定において、歯科用合着・接着材料の機能区分の
     見直しが行われたが、歯科用合着・接着材料Ⅰには、グラスアイオノマー
     セメントの組成（フルオロアルミノシリケートガラスとポリアクリル酸
     等）を主として、レジン成分が添加されているセメントは含まれるのか。
</pre></div>
<!-- gigi_r080717_1.pdf:5 ke.txt:6994 --><pre>（答） 含まれない。なお、当該機能区分の定義における「接着性モノマー」とは、
       歯質に対する接着性を有する、カルボン酸系モノマー（４-META 等）やリン
       酸エステル系モノマー（MDP 等）を指す。
</pre>
