<h1 class='title'>医科診療報酬点数表関係<br>【眼科医療機関連携強化加算、歯科医療機関連携強化加算】</h1>
<div id='content'>
<!-- gigi_r080902_1.pdf:2 ke.txt:7135 --><div class='rbox'><pre>問５ 現に患者が通院している眼科又は歯科を標榜する他の保険医療機関に
     対して、診療状況を示す文書を添えて患者の情報提供を行った場合、眼科
     医療機関連携強化加算又は歯科医療機関連携強化加算は算定可能か。
</pre></div>
<!-- gigi_r080902_1.pdf:3 ke.txt:7140 --><pre>（答） 現に患者が眼科又は歯科を標榜する他の保険医療機関に通院中である場
       合であっても、医学的な必要性に基づき、診療情報提供書等を用いて毎年
       定期的に情報提供を行う場合は、同一患者に対して年に１回継続して当該
       加算を算定可能。
</pre>
</div>
